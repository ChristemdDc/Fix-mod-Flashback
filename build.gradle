plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.142'
}

group = 'com.ezguzman.flashbackfix'
version = '2.3.0'

base {
    archivesName = 'flashbackfix'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.230'

    mods {
        flashbackfix {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // MixinSquared lo provee Flashback en runtime (JiJ). Solo lo necesitamos para compilar el
    // MixinCanceller que desactiva la optimizacion 'cache_strongholds' de ModernFix en el cliente.
    compileOnly files('libs/mixinsquared-fabric-0.3.7-beta.1.jar')
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : 'Flashback Fix',
                'Implementation-Title'  : 'flashbackfix',
                'Implementation-Version': project.version
        ])
    }
}
